name: CI

on:
  push:
    branches:
      - master
      - dev
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22
          - 24
          - 26

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run build
      - run: npm test
      - run: npm run examples
      - name: Install the packed package and run it
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/inline-email-*.tgz
          node --input-type=module -e "
            import { compileEmailTemplate } from 'inline-email';
            const compiled = await compileEmailTemplate({ subject: 'Hi {{name}}', html: '<p class=\"m\">Hi {{name}}</p>', css: '.m { color: #246bfe; }' });
            const { html } = compiled.render({ data: { name: 'Ada' } });
            if (!html.includes('style=\"color: #246bfe;\"')) throw new Error(html);
          "
          printf '<p>Hello {{name}}</p>' > email.html
          printf '{"name":"Ada"}' > data.json
          npx --no-install inline-email email.html --data data.json --strict | grep -q 'Hello Ada'

  visual:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-results
          path: test-results/visual
